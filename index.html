<body>
<div id="app"></div>
<div class="title">
  <h1>P A R A D I G M</h1>
  <p>Build the wiring path. <b>Manual</b>: click nodes in order. <b>First–last</b>: set a count, click the first & last node, it fills between. Numbers run 1→323 across boards. Power: bus bars.</p>
</div>
<div class="panel" id="boards"></div>
<div class="hint" id="hint">pick a board · hover a node to see its number (→ N) · click to add it</div>
<div class="mode">
  <div class="seg" id="modeSeg"><button data-m="build" class="on">manual</button><button data-m="ends">first–last</button><button data-m="orbit">orbit</button></div>
  <span id="countwrap" style="display:none;font-size:11.5px;color:var(--dim)">count <input id="count" inputmode="numeric" value="81" style="width:48px;font:inherit;font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 4px"></span>
  <button id="trace" style="display:none;border-color:var(--b0);color:var(--b0)">trace ▸</button>
  <button id="undo">undo</button>
  <button id="clearb">clear board</button>
  <button id="nums">hide numbers</button>
  <button id="hub">hide cable-to-hub</button>
  <button id="save">export .json</button>
</div>

<script type="module">
import * as THREE from 'three';
const POS=window.POS;

const BC=['#ff9a3c','#4bd6c4','#c77dff','#ffd24b']; const BCOL=BC.map(c=>new THREE.Color(c));

const spr=(()=>{const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d');const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'#fff');r.addColorStop(.4,'#fff');r.addColorStop(1,'#0000');g.fillStyle=r;g.beginPath();g.arc(s/2,s/2,s/2,0,7);g.fill();return new THREE.CanvasTexture(cv);})();

      if(k<arr.length-1){ h[w*3]=0;h[w*3+1]=0;h[w*3+2]=0; w++; } }
    hubLines[b].geometry.setAttribute('position',new THREE.BufferAttribute(h,3));
    hubLines[b].geometry.setDrawRange(0,vcount);
    hubLines[b].geometry.attributes.position.needsUpdate=true;
    hubLines[b].visible=showHub&&boardVisible[b]&&arr.length>1;
  }
  updateStatus();
}

// boards UI
const boardsEl=document.getElementById('boards');
function buildBoards(){
  boardsEl.innerHTML='';
  for(let b=0;b<4;b++){
    const row=document.createElement('div'); row.className='brow'+(b===curBoard?' on':''); row.style.color=BC[b];
    row.innerHTML='<span class="eye" id="eye'+b+'" style="color:'+BC[b]+'">●</span>'+
      '<span class="sw" style="background:'+BC[b]+'"></span><span class="nm">Board '+b+'</span>'+
      '<span class="rng" id="rng'+b+'"></span>';
    row.onclick=(e)=>{ if(e.target.id&&e.target.id.startsWith('eye'))return; curBoard=b; [...boardsEl.children].forEach((r,i)=>r.classList.toggle('on',i===b)); };
    boardsEl.appendChild(row);
  }
  for(let b=0;b<4;b++){ const eye=document.getElementById('eye'+b);
    eye.onclick=(e)=>{ e.stopPropagation(); boardVisible[b]=!boardVisible[b]; eye.textContent=boardVisible[b]?'●':'○'; eye.style.opacity=boardVisible[b]?'1':'0.4'; repaint(); }; }
}
buildBoards();

function updateStatus(){
  let total=0;
  for(let b=0;b<4;b++){
    const arr=paths[b]; total+=arr.length;
    const el=document.getElementById('rng'+b);
    if(el){ if(arr.length){ const s=globalNumber(b,0),e=globalNumber(b,arr.length-1); el.textContent=s+'–'+e+' ('+arr.length+'n · '+(arr.length*Wnode).toFixed(0)+'W)'; } else el.textContent='empty'; }
  }
  document.getElementById('status').innerHTML=
    total+'/'+N+' placed'+(total<N?' · <span style="color:#ffd24b">'+(N-total)+' left</span>':' · <span style="color:#4bd67a">complete</span>')+
    '<br>power: bus bars';
}

// picking: nearest node to cursor within a tight screen radius
const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
function pick(cx,cy){
  ray.params.Points.threshold=0.09;
  mouse.x=(cx/innerWidth)*2-1; mouse.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObject(dots);
  if(!hits.length) return -1;
  // choose the closest to the camera among hits very near the ray (accurate front pick)
  hits.sort((a,b)=>a.distanceToRay-b.distanceToRay || a.distance-b.distance);
  return hits[0].index;
}
function addNode(i){
  if(i<0) return;
  if(nodeBoard[i]===curBoard) return;           // already in this board
  if(nodeBoard[i]>=0){                            // steal from another board
    const ob=nodeBoard[i]; const k=paths[ob].indexOf(i); if(k>=0) paths[ob].splice(k,1);
  }
  nodeBoard[i]=curBoard; paths[curBoard].push(i);
  repaint();
}

const dom=renderer.domElement;
let orbiting=false,px=0,py=0;
dom.addEventListener('pointermove',e=>{
  if(orbiting){ camTheta-=(e.clientX-px)*0.006; camPhi-=(e.clientY-py)*0.006; camPhi=Math.max(0.2,Math.min(Math.PI-0.2,camPhi)); px=e.clientX;py=e.clientY; placeCam(); return; }
  if(mode==='build'){ const i=pick(e.clientX,e.clientY); hoverIdx=i;
    if(i>=0){ hover.visible=true; hoverGeo.attributes.position.setXYZ(0,pos[i*3],pos[i*3+1],pos[i*3+2]); hoverGeo.attributes.position.needsUpdate=true; hover.material.color.set(BC[curBoard]); }
    else hover.visible=false; }
  else hoverIdx=-1;
});
dom.addEventListener('pointerdown',e=>{
  if(mode==='orbit'){ orbiting=true; px=e.clientX; py=e.clientY; return; }
  const i=pick(e.clientX,e.clientY); if(i<0) return;
  if(mode==='build'){ addNode(i); return; }
  // first–last mode: set endpoints, show them, wait for Trace
  if(endFirst<0 || (endFirst>=0 && endLast>=0)){ endFirst=i; endLast=-1; flashHint('FIRST set (node shown) → now click the LAST node'); }
  else { endLast=i; flashHint('FIRST & LAST set → press Trace to fill between'); }
  updateEndMarkers();
});
function flashHint(t){ const h=document.getElementById('hint'); h.textContent=t; }
function doTrace(){
  if(endFirst<0||endLast<0){ flashHint('pick a FIRST and LAST node first'); return; }
  const first=endFirst,last=endLast;
  const used=new Set(); for(let b=0;b<4;b++){ if(b===curBoard)continue; paths[b].forEach(n=>used.add(n)); }
  paths[curBoard].forEach(n=>nodeBoard[n]=-1); paths[curBoard]=[];
  const cnt=Math.max(2,Math.min(N,parseInt(document.getElementById('count').value)||boardCount));
  const run=fillRun(first,last,cnt,used);
  run.forEach(n=>{ if(nodeBoard[n]>=0&&nodeBoard[n]!==curBoard){const ob=nodeBoard[n];const k=paths[ob].indexOf(n);if(k>=0)paths[ob].splice(k,1);} nodeBoard[n]=curBoard; });
  paths[curBoard]=run; endFirst=-1; endLast=-1; updateEndMarkers(); repaint();
  flashHint('traced '+run.length+' nodes for Board '+curBoard);
}
addEventListener('pointerup',()=>orbiting=false);
dom.addEventListener('wheel',e=>{e.preventDefault();camR=Math.max(4,Math.min(18,camR+e.deltaY*0.004));placeCam();},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

document.getElementById('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  hover.visible=false;
  // keep endpoints when toggling to orbit (so picks survive rotating); clear only when going to manual
  if(mode==='build'){ endFirst=-1; endLast=-1; }
  updateEndMarkers();
  // count/trace UI visible in ends mode; also keep visible in orbit if endpoints are pending
  const endsUI = (mode==='ends') || (endFirst>=0);
  document.getElementById('countwrap').style.display = endsUI?'inline':'none';
  document.getElementById('trace').style.display = endsUI?'inline':'none';
  document.getElementById('hint').textContent =
    mode==='build'?'manual · hover a node to see its number (→ N) · click to add it':
    mode==='ends'?'first–last · set count, click the FIRST node, then the LAST — it fills between':
    'drag to orbit · switch to a build mode to edit';});
document.getElementById('trace').onclick=doTrace;
document.getElementById('undo').onclick=()=>{ const arr=paths[curBoard]; if(arr.length){ const i=arr.pop(); nodeBoard[i]=-1; repaint(); } };
document.getElementById('clearb').onclick=()=>{ paths[curBoard].forEach(i=>nodeBoard[i]=-1); paths[curBoard]=[]; repaint(); };
document.getElementById('nums').onclick=(e)=>{ showNums=!showNums; e.target.textContent=showNums?'hide numbers':'show numbers'; };
document.getElementById('hub').onclick=(e)=>{ showHub=!showHub; e.target.textContent=showHub?'hide cable-to-hub':'show cable-to-hub'; repaint(); };
document.getElementById('save').onclick=()=>{
  const assignment=[]; let num=0;
  for(let b=0;b<4;b++){ for(let k=0;k<paths[b].length;k++){ num++; assignment.push({number:num, uid:UIDS[paths[b][k]], board:b, order_in_board:k}); } }
  const data={project:'PARADIGM',kind:'manual-wiring-path',nodes:N,node_W:Wnode,
    boards:[0,1,2,3].map(b=>({board:b,count:paths[b].length,
      first:paths[b].length?globalNumber(b,0):null,last:paths[b].length?globalNumber(b,paths[b].length-1):null})),
    assignment};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paradigm_wiring_path.json';a.click();URL.revokeObjectURL(a.href);
};

// number labels (endpoints of each board + every ~Nth along current board, densely when soloed)
const labelWrap=document.createElement('div'); labelWrap.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:3'; document.body.appendChild(labelWrap);
let pool=[]; const _v=new THREE.Vector3();
function labelSet(){
  const out=[]; // {i, num, b}
  const solo=boardVisible.filter(Boolean).length===1?boardVisible.indexOf(true):-1;
  for(let b=0;b<4;b++){
    if(!boardVisible[b]||!paths[b].length) continue;
    const arr=paths[b];
    const dense = (b===solo);
    const step = dense?1:Math.max(1,Math.round(arr.length/12));  // every node when soloed
    for(let k=0;k<arr.length;k+=step) out.push({i:arr[k],num:globalNumber(b,k),b});
    out.push({i:arr[0],num:globalNumber(b,0),b});
    out.push({i:arr[arr.length-1],num:globalNumber(b,arr.length-1),b});
  }
  return out;
}
// dedicated hover label (always shown while hovering in build mode)
const hoverLabel=document.createElement('div'); hoverLabel.className='numlabel'; hoverLabel.style.display='none';
hoverLabel.style.fontSize='12px'; hoverLabel.style.fontWeight='600'; labelWrap.appendChild(hoverLabel);
function updateHoverLabel(){
  if(mode!=='build'||hoverIdx<0){ hoverLabel.style.display='none'; return; }
  const i=hoverIdx;
  // prospective number: if already on current board show its number, else it'd be appended
  let num, col;
  if(nodeBoard[i]===curBoard){ const k=paths[curBoard].indexOf(i); num=globalNumber(curBoard,k); col=BC[curBoard]; }
  else { num=globalNumber(curBoard, paths[curBoard].length); col=BC[curBoard]; }
  _v.set(pos[i*3],pos[i*3+1],pos[i*3+2]).project(camera);
  if(_v.z>1){ hoverLabel.style.display='none'; return; }
  hoverLabel.style.display='block'; hoverLabel.textContent='→ '+num; hoverLabel.style.borderColor=col; hoverLabel.style.color='#fff';
  hoverLabel.style.left=((_v.x*0.5+0.5)*innerWidth)+'px'; hoverLabel.style.top=((-_v.y*0.5+0.5)*innerHeight-14)+'px';
}
function updateLabels(){
  updateHoverLabel();
  if(!showNums){ pool.forEach(el=>el.style.display='none'); return; }
  const set=labelSet();
  while(pool.length<set.length){ const el=document.createElement('div'); el.className='numlabel'; labelWrap.appendChild(el); pool.push(el); }
  for(let j=0;j<pool.length;j++){ const el=pool[j];
    if(j>=set.length){ el.style.display='none'; continue; }
    const {i,num,b}=set[j];
    _v.set(pos[i*3],pos[i*3+1],pos[i*3+2]).project(camera);
    if(_v.z>1){ el.style.display='none'; continue; }
    el.style.display='block'; el.textContent=num; el.style.borderColor=BC[b];
    el.style.left=((_v.x*0.5+0.5)*innerWidth)+'px'; el.style.top=((-_v.y*0.5+0.5)*innerHeight)+'px';
  }
}

repaint();
function updateEndLabels(){
  const pts=[{i:endFirst,t:'FIRST'},{i:endLast,t:'LAST'}];
  pts.forEach((pt,s)=>{ const el=endLabels[s];
    if(pt.i<0){ el.style.display='none'; return; }
    _v.set(pos[pt.i*3],pos[pt.i*3+1],pos[pt.i*3+2]).project(camera);
    if(_v.z>1){ el.style.display='none'; return; }
    el.style.display='block'; el.textContent=pt.t; el.style.borderColor=BC[curBoard]; el.style.color='#fff';
    el.style.left=((_v.x*0.5+0.5)*innerWidth)+'px'; el.style.top=((-_v.y*0.5+0.5)*innerHeight-16)+'px';
  });
}
function tick(){ updateLabels(); updateEndLabels(); renderer.render(scene,camera); requestAnimationFrame(tick); } tick();
</script>
