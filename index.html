<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARADIGM — wiring</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#12151c; --ink:#e8e6df; --dim:#8a8f9a; --line:#242a35;
    --w0:#ff9a3c; --w1:#4bd6c4; --w2:#c77dff; --w3:#ffd24b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;padding:22px}
  .hud *{pointer-events:auto}
  .title{position:fixed;top:0;left:0;padding:22px 26px}
  .title h1{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:15px;font-weight:600;letter-spacing:.34em}
  .title p{margin:6px 0 0;font-size:12.5px;color:var(--dim);letter-spacing:.02em;max-width:34ch;line-height:1.5}

  .board{display:flex;align-items:flex-start;justify-content:flex-end;gap:12px;
    margin:0 0 4px;cursor:pointer;user-select:none;padding:7px 9px;border-radius:7px;
    transition:background .15s}
  .board:hover{background:#ffffff08}
  .board.off{opacity:.32}
  .board .ct{text-align:right;line-height:1.5}
  .board .nm{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.06em}
  .board .sub{font-size:11px;color:var(--dim);letter-spacing:.01em}
  .sw{width:26px;height:3px;border-radius:2px;flex:none;margin-top:6px}
  .foot{position:fixed;left:0;bottom:0;padding:18px 26px;font-size:11.5px;color:var(--dim);
    letter-spacing:.02em;line-height:1.6}
  .foot b{color:var(--ink);font-weight:500}
  .ctrls{position:fixed;right:0;bottom:0;padding:18px 24px;text-align:right;
    font-size:11.5px;color:var(--dim);line-height:1.7}
  .ctrls button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);
    border-radius:7px;padding:6px 12px;margin-left:8px;cursor:pointer;letter-spacing:.03em;
    transition:border-color .15s,background .15s}
  .ctrls button:hover{border-color:#3a4250;background:#ffffff08}
  .ctrls button:focus-visible{outline:2px solid var(--w1);outline-offset:2px}
  .tip{position:fixed;padding:9px 12px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;
    pointer-events:none;opacity:0;transition:opacity .12s;transform:translate(-50%,-140%);
    white-space:nowrap;z-index:10}
  .tip .k{color:var(--dim)}
  .injlabel{position:fixed;transform:translate(-50%,-190%);white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;
    color:var(--ink);background:#12151cdd;border:1px solid var(--line);border-left-width:3px;
    border-radius:5px;padding:2px 7px;pointer-events:none}
  @media (max-width:640px){
    .title p{max-width:24ch}.board .ct{min-width:92px}
    .foot{max-width:60vw}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="module">
import * as THREE from 'three';

const W = window.WIRING;
const COLORS = ['#ff9a3c','#4bd6c4','#c77dff','#ffd24b'];
const COL3 = COLORS.map(c=>new THREE.Color(c));

// ---------- scene ----------
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#0a0c10');
scene.fog=new THREE.FogExp2('#0a0c10',0.055);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
let camR=8.2, camTheta=0.6, camPhi=1.35, camTarget=new THREE.Vector3(0,0,0);
function placeCam(){
  camera.position.set(
    camR*Math.sin(camPhi)*Math.cos(camTheta),
    camR*Math.cos(camPhi),
    camR*Math.sin(camPhi)*Math.sin(camTheta));
  camera.lookAt(camTarget);
}
placeCam();

// faint ground + base disc to echo the sculpture standing on a plinth
const grid=new THREE.GridHelper(24,24,0x1a1f29,0x141821);
grid.position.y=-2.35; scene.add(grid);
const base=new THREE.Mesh(
  new THREE.CylinderGeometry(1.0,1.15,0.18,48),
  new THREE.MeshBasicMaterial({color:0x161b24}));
base.position.y=-2.26; scene.add(base);

// ---------- build nodes + chains ----------
const group=new THREE.Group(); scene.add(group);

// gather node list flat, remember board
const flat=[];
W.boards.forEach((chain,b)=>chain.forEach(n=>flat.push({...n,board:b})));

// stalk lines: center -> tip, dim, board-tinted
const stalkPos=[], stalkCol=[];
flat.forEach(n=>{
  const c=COL3[n.board];
  stalkPos.push(0,0,0, n.p[0],n.p[1],n.p[2]);
  stalkCol.push(c.r*0.10,c.g*0.10,c.b*0.10,  c.r*0.5,c.g*0.5,c.b*0.5);
});
const stalkG=new THREE.BufferGeometry();
stalkG.setAttribute('position',new THREE.Float32BufferAttribute(stalkPos,3));
stalkG.setAttribute('color',new THREE.Float32BufferAttribute(stalkCol,3));
const stalks=new THREE.LineSegments(stalkG,
  new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.55}));
group.add(stalks);

// tip points (instanced via Points) — glowing cores
const tipG=new THREE.BufferGeometry();
const tp=[],tc=[];
flat.forEach(n=>{const c=COL3[n.board];tp.push(...n.p);tc.push(c.r,c.g,c.b);});
tipG.setAttribute('position',new THREE.Float32BufferAttribute(tp,3));
tipG.setAttribute('color',new THREE.Float32BufferAttribute(tc,3));
// round sprite
const spr=(()=>{const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;
  const g=cv.getContext('2d');const rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  rg.addColorStop(0,'#fff');rg.addColorStop(.35,'#fff');rg.addColorStop(1,'#0000');
  g.fillStyle=rg;g.beginPath();g.arc(s/2,s/2,s/2,0,7);g.fill();
  const t=new THREE.CanvasTexture(cv);return t;})();
const tips=new THREE.Points(tipG,new THREE.PointsMaterial({
  size:0.16,map:spr,vertexColors:true,transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,sizeAttenuation:true}));
group.add(tips);

// per-board daisy-chain paths (the actual wiring order) — drawn as lines through tips
const chainLines=[];
W.boards.forEach((chain,b)=>{
  const pos=[];
  chain.forEach(n=>pos.push(n.p[0],n.p[1],n.p[2]));
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const ln=new THREE.Line(g,new THREE.LineBasicMaterial({
    color:COL3[b],transparent:true,opacity:0.0}));  // hidden until "show flow"
  ln.userData.board=b; group.add(ln); chainLines.push(ln);
});

// ---- flow pulses: dots that ride each chain base->tip in wiring order ----
// precompute per-chain polyline with cumulative arc-length for constant-speed travel
const chainPaths=W.boards.map(chain=>{
  const pts=chain.map(n=>new THREE.Vector3(n.p[0],n.p[1],n.p[2]));
  const cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+pts[i].distanceTo(pts[i-1]));
  return {pts,cum,len:cum[cum.length-1]};
});
function pointAt(path,dist){                 // sample xyz at arc-length dist
  const {pts,cum,len}=path;
  if(dist<=0) return pts[0];
  if(dist>=len) return pts[pts.length-1];
  let i=1; while(cum[i]<dist) i++;
  const t=(dist-cum[i-1])/(cum[i]-cum[i-1]);
  return pts[i-1].clone().lerp(pts[i],t);
}
const PULSES_PER_CHAIN=5;                     // evenly spaced travellers
const flowGeom=new THREE.BufferGeometry();
const flowN=4*PULSES_PER_CHAIN;
const flowPos=new Float32Array(flowN*3), flowCol=new Float32Array(flowN*3);
flowGeom.setAttribute('position',new THREE.BufferAttribute(flowPos,3));
flowGeom.setAttribute('color',new THREE.BufferAttribute(flowCol,3));
const flow=new THREE.Points(flowGeom,new THREE.PointsMaterial({
  size:0.30,map:spr,vertexColors:true,transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,sizeAttenuation:true,opacity:0}));
group.add(flow);
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;

// ---- injection points: power feeds, drawn as bright ringed markers ----
const injList=[];
W.boards.forEach((chain,b)=>chain.forEach(n=>{ if(n.inject) injList.push({...n,board:b}); }));
const injGeom=new THREE.BufferGeometry();
const ip=[],ic=[];
injList.forEach(n=>{const c=COL3[n.board];ip.push(...n.p);ic.push(c.r,c.g,c.b);});
injGeom.setAttribute('position',new THREE.Float32BufferAttribute(ip,3));
injGeom.setAttribute('color',new THREE.Float32BufferAttribute(ic,3));
// ring sprite (hollow) so injection reads differently from a lit node
const ringSpr=(()=>{const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;
  const g=cv.getContext('2d');g.strokeStyle='#fff';g.lineWidth=7;
  g.beginPath();g.arc(s/2,s/2,s/2-6,0,7);g.stroke();
  g.lineWidth=3;g.beginPath();g.arc(s/2,s/2,s/2-20,0,7);g.stroke();
  return new THREE.CanvasTexture(cv);})();
const injMarks=new THREE.Points(injGeom,new THREE.PointsMaterial({
  size:0.55,map:ringSpr,vertexColors:true,transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,opacity:0.95,sizeAttenuation:true}));
group.add(injMarks);

// ---- power-injection labels (HTML, projected to screen each frame) ----
const injLabelWrap=document.createElement('div');
injLabelWrap.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:5';
document.body.appendChild(injLabelWrap);
const injLabels=injList.map(n=>{
  const el=document.createElement('div');
  el.className='injlabel';
  el.style.borderColor=COLORS[n.board];
  el.textContent='⏻ '+n.label;
  injLabelWrap.appendChild(el);
  return el;
});
const _pv=new THREE.Vector3();
function updateInjLabels(){
  for(let i=0;i<injList.length;i++){
    const n=injList[i], el=injLabels[i];
    if(!boardVisible[n.board]){ el.style.display='none'; continue; }
    _pv.set(n.p[0],n.p[1],n.p[2]).project(camera);
    if(_pv.z>1){ el.style.display='none'; continue; }   // behind camera
    el.style.display='block';
    el.style.left=((_pv.x*0.5+0.5)*innerWidth)+'px';
    el.style.top=((-_pv.y*0.5+0.5)*innerHeight)+'px';
  }
}

// ---- data-segment terminators: 120Ω end-of-segment markers ----
const termList=[];
W.boards.forEach((chain,b)=>chain.forEach(n=>{ if(n.term) termList.push({...n,board:b}); }));
const termGeom=new THREE.BufferGeometry();
const tpp=[],tcc=[];
termList.forEach(n=>{tpp.push(...n.p);tcc.push(1,1,1);});
termGeom.setAttribute('position',new THREE.Float32BufferAttribute(tpp,3));
termGeom.setAttribute('color',new THREE.Float32BufferAttribute(tcc,3));
// small square-ish marker = terminator
const sqSpr=(()=>{const s=48,cv=document.createElement('canvas');cv.width=cv.height=s;
  const g=cv.getContext('2d');g.strokeStyle='#fff';g.lineWidth=6;
  g.strokeRect(8,8,s-16,s-16);return new THREE.CanvasTexture(cv);})();
const termMarks=new THREE.Points(termGeom,new THREE.PointsMaterial({
  size:0.34,map:sqSpr,vertexColors:true,transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,opacity:0,sizeAttenuation:true}));  // shown with "show flow"
group.add(termMarks);

// base "spine" markers: highlight the first node of each chain (cable entry)
const entryG=new THREE.BufferGeometry();
const ep=[],ec=[];
W.boards.forEach((chain,b)=>{const n=chain[0];const c=COL3[b];ep.push(...n.p);ec.push(c.r,c.g,c.b);});
entryG.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));
entryG.setAttribute('color',new THREE.Float32BufferAttribute(ec,3));
const entries=new THREE.Points(entryG,new THREE.PointsMaterial({
  size:0.42,map:spr,vertexColors:true,transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,opacity:0.9}));
group.add(entries);

// ---------- legend ----------
const legend=document.getElementById('legend');
const boardVisible=[true,true,true,true];
W.boards.forEach((chain,b)=>{
  // segment sizes for this board, in order
  const segSizes={};
  chain.forEach(n=>{segSizes[n.seg]=(segSizes[n.seg]||0)+1;});
  const segs=Object.keys(segSizes).sort((a,x)=>a-x).map(k=>segSizes[k]);
  const slotHi=Math.max(...chain.map(n=>n.d+2));
  const row=document.createElement('div');row.className='board';row.dataset.b=b;
  row.innerHTML=
    `<div class="ct"><span class="nm">board ${b}</span> · univ ${b}<br>`+
    `<span class="sub">${chain.length} nodes · ${segs.length} segments (${segs.join('+')}) · slots 1–${slotHi}</span></div>`+
    `<span class="sw" style="background:${COLORS[b]}"></span>`;
  row.onclick=()=>{boardVisible[b]=!boardVisible[b];row.classList.toggle('off',!boardVisible[b]);applyVis();};
  legend.appendChild(row);
});

document.getElementById('foot').innerHTML=
  `<b>${W.count} nodes</b> · 4 wedges (${W.nodes_per_board.join(' / ')}) · `+
  `bus ${W.bus_walk_m.join(' / ')} m · ${W.slots_per_universe_used.join('/')} slots per universe`+
  `<br><b>24 V</b> · <b>${injList.length} power injection points</b> (○) · 3 per board, centre-fed thirds`+
  `<br><b>RS-485 / DMX512</b> · SP3485 (1 UL) · <b>12 data segments</b> ≤27 nodes · 120Ω term (▫) at each tail`;

// ---------- visibility handling ----------
let showChains=false;
function applyVis(){
  // rebuild stalk/tip colors with per-node visibility by dimming hidden boards
  const sc=stalkG.attributes.color.array, tcA=tipG.attributes.color.array;
  flat.forEach((n,i)=>{
    const on=boardVisible[n.board];const c=COL3[n.board];
    const k=on?1:0.06;
    // stalk (2 verts): inner, outer
    sc[i*6+0]=c.r*0.10*k;sc[i*6+1]=c.g*0.10*k;sc[i*6+2]=c.b*0.10*k;
    sc[i*6+3]=c.r*0.5*k; sc[i*6+4]=c.g*0.5*k; sc[i*6+5]=c.b*0.5*k;
    tcA[i*3+0]=c.r*(on?1:0.08);tcA[i*3+1]=c.g*(on?1:0.08);tcA[i*3+2]=c.b*(on?1:0.08);
  });
  stalkG.attributes.color.needsUpdate=true;
  tipG.attributes.color.needsUpdate=true;
  chainLines.forEach(ln=>ln.material.opacity=(showChains&&boardVisible[ln.userData.board])?0.85:0.0);
  // injection markers: hidden entirely when their board is off (additive black = invisible)
  const ia=injGeom.attributes.color.array;
  injList.forEach((n,i)=>{const c=COL3[n.board];const k=boardVisible[n.board]?1:0;
    ia[i*3]=c.r*k;ia[i*3+1]=c.g*k;ia[i*3+2]=c.b*k;});
  injGeom.attributes.color.needsUpdate=true;
  termMarks.material.opacity=showChains?0.9:0.0;
  // terminators: hidden when their board is off (additive black = invisible)
  const ta=termGeom.attributes.color.array;
  termList.forEach((n,i)=>{const k=boardVisible[n.board]?1:0;
    ta[i*3]=k;ta[i*3+1]=k;ta[i*3+2]=k;});
  termGeom.attributes.color.needsUpdate=true;
  updateInjLabels();
}
applyVis();

// ---------- interaction: orbit ----------
let drag=false,px=0,py=0,spin=false;
const dom=renderer.domElement;
dom.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;
  if(spin){spin=false;document.getElementById('spin').textContent='spin';}});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  updateHover(e.clientX,e.clientY);
  if(!drag)return;
  camTheta-=(e.clientX-px)*0.006; camPhi-=(e.clientY-py)*0.006;
  camPhi=Math.max(0.2,Math.min(Math.PI-0.2,camPhi));
  px=e.clientX;py=e.clientY;placeCam();
});
dom.addEventListener('wheel',e=>{e.preventDefault();
  camR=Math.max(3.5,Math.min(20,camR+e.deltaY*0.004));placeCam();},{passive:false});

document.getElementById('spin').onclick=e=>{spin=!spin;e.target.textContent=spin?'stop':'spin';};
document.getElementById('chains').onclick=e=>{showChains=!showChains;e.target.textContent=showChains?'hide flow':'show flow →';document.getElementById('mode').textContent=showChains?'pulses travel base → tip in wiring order':'drag to orbit · scroll to zoom · hover a node';applyVis();};

// ---------- hover pick ----------
const ray=new THREE.Raycaster();ray.params.Points.threshold=0.12;
const mouse=new THREE.Vector2();const tipEl=document.getElementById('tip');
function updateHover(cx,cy){
  mouse.x=(cx/innerWidth)*2-1; mouse.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObject(tips);
  if(hit.length){
    const idx=hit[0].index;const n=flat[idx];
    if(boardVisible[n.board]){
      tipEl.style.opacity=1;tipEl.style.left=cx+'px';tipEl.style.top=cy+'px';
      tipEl.style.borderColor=COLORS[n.board];
      tipEl.innerHTML=
        `<span class="k">uid</span> ${n.uid} &nbsp; <span class="k">${n.label}</span>`+
        (n.inject?` &nbsp; ⏻ <span class="k">POWER</span>`:``)+
        (n.term?` &nbsp; ▪ <span class="k">120Ω TERM</span>`:``)+
        (n.head?` &nbsp; ▸ <span class="k">SEG HEAD</span>`:``)+`<br>`+
        `<span class="k">board</span> ${n.board} · <span class="k">seg</span> ${n.seg} · <span class="k">chain</span> #${n.c} · <span class="k">dmx</span> ${n.d}–${n.d+2}`;
      return;
    }
  }
  tipEl.style.opacity=0;
}

// ---------- render loop ----------
const SPEED=1.4;                 // metres/second the pulse travels along the bus
let flowT=0, lastT=performance.now();
function tick(){
  const now=performance.now(); const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(spin){camTheta+=0.0016;placeCam();}

  // flow pulses
  const targetOp=(showChains&&!reduceMotion)?0.95:0;
  flow.material.opacity+=(targetOp-flow.material.opacity)*0.15;
  if(flow.material.opacity>0.01){
    if(!reduceMotion) flowT+=dt*SPEED;
    let w=0;
    for(let b=0;b<4;b++){
      const path=chainPaths[b], on=boardVisible[b];
      const c=COL3[b];
      for(let k=0;k<PULSES_PER_CHAIN;k++){
        const phase=(flowT + k*path.len/PULSES_PER_CHAIN)%path.len; // base->tip loop
        const p=pointAt(path,phase);
        flowPos[w*3]=p.x;flowPos[w*3+1]=p.y;flowPos[w*3+2]=p.z;
        // brighten as it climbs, fade near the very end; hide if board off
        const climb=0.35+0.65*(phase/path.len);
        const kk=on?climb:0;
        flowCol[w*3]=c.r*kk;flowCol[w*3+1]=c.g*kk;flowCol[w*3+2]=c.b*kk;
        w++;
      }
    }
    flowGeom.attributes.position.needsUpdate=true;
    flowGeom.attributes.color.needsUpdate=true;
  }

  updateInjLabels();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
